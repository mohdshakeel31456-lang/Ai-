<!DOCTYPE html>
<html>
<head>
  <title>AI Tools for YouTubers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; margin:0; background:#0f172a; color:white;}
    header { padding:20px; text-align:center; background:#1e293b;}
    h1 { margin:0;}
    .container { padding:20px;}
    .card {
      background:#1e293b;
      padding:15px;
      margin:10px 0;
      border-radius:10px;
    }
    button {
      padding:10px;
      background:#22c55e;
      border:none;
      color:white;
      border-radius:5px;
    }
  </style>
</head>

<body>

<header>
  <h1>🔥 AI Tools for YouTubers</h1>
</header>

<div class="container">

  <div class="card">
    <h2>CapCut</h2>
    <p>Best free video editing app</p>
    <button onclick="window.location.href='https://www.capcut.com'">Use Now</button>
  </div>

  <div class="card">
    <h2>Canva</h2>
    <p>Create thumbnails easily</p>
    <button onclick="window.location.href='https://www.canva.com'">Use Now</button>
  </div>

  <div class="card">
    <h2>Leonardo AI</h2>
    <p>Generate AI images</p>
    <button onclick="window.location.href='https://leonardo.ai'">Use Now</button>
  </div>

</div>

</body>
      </html>
